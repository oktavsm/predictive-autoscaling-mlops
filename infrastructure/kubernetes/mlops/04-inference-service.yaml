apiVersion: v1
kind: Service
metadata:
  name: mlops-inference-svc
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-inference-svc
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlops-inference
  ports:
    - name: http-api
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
    - name: metrics-scaler
      port: 9102
      targetPort: 9102
      nodePort: 30902
      protocol: TCP
