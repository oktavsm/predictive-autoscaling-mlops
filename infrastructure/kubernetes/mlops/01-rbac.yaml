apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-service-account
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-service-account
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlops-scaler-clusterrole
  labels:
    app.kubernetes.io/name: mlops-scaler-clusterrole
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mlops-scaler-clusterrolebinding
  labels:
    app.kubernetes.io/name: mlops-scaler-clusterrolebinding
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
subjects:
  - kind: ServiceAccount
    name: mlops-service-account
    namespace: mlops
roleRef:
  kind: ClusterRole
  name: mlops-scaler-clusterrole
  apiGroup: rbac.authorization.k8s.io
