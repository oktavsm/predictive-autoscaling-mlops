apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-mlflow
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-mlflow
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-mlflow
        app.kubernetes.io/component: model-registry
        app.kubernetes.io/part-of: predictive-autoscaling-mlops
    spec:
      containers:
        - name: mlflow-server
          image: docker.io/oktaavsm/predictive-autoscaler:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              value: "sqlite:////app/mlflow.db"
            - name: MLFLOW_DEFAULT_ARTIFACT_ROOT
              value: "/app/mlruns"
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "https://mlflow.titipin.me,http://mlflow.titipin.me,https://*.titipin.me,http://localhost:5000,http://127.0.0.1:5000"
          command:
            - "/bin/sh"
            - "-c"
            - |
              mkdir -p /home/oktaavsm/Code/github.com/college/predictive-autoscaling-mlops && \
              ln -sf /app/mlruns /home/oktaavsm/Code/github.com/college/predictive-autoscaling-mlops/mlruns && \
              exec python -m uvicorn mlflow.server.fastapi_app:app --host 0.0.0.0 --port 5000 --workers 1
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              cpu: 1000m
              memory: 800Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-mlflow-svc
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-mlflow
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlops-mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
