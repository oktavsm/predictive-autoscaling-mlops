apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-dashboard
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-dashboard
    app.kubernetes.io/component: control-dashboard
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-dashboard
        app.kubernetes.io/component: control-dashboard
        app.kubernetes.io/part-of: predictive-autoscaling-mlops
    spec:
      containers:
        - name: dashboard
          image: docker.io/oktaavsm/predictive-autoscaler-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: INFERENCE_API_URL
              value: "http://mlops-inference-svc.mlops.svc.cluster.local:8000"
            - name: INFERENCE_SERVICE_URL
              value: "http://mlops-inference-svc.mlops.svc.cluster.local:8000"
            - name: MLFLOW_URL
              value: "https://mlflow.titipin.me"
            - name: MINIO_URL
              value: "https://minio.titipin.me"
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_SERVER_ADDRESS
              value: "0.0.0.0"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: dashboard-code
              mountPath: /app/src/dashboard/app.py
              subPath: app.py
      volumes:
        - name: dashboard-code
          configMap:
            name: mlops-dashboard-code
