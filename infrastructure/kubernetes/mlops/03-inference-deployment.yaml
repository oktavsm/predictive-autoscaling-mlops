apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-inference
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-inference
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-inference
        app.kubernetes.io/component: inference-engine
        app.kubernetes.io/part-of: predictive-autoscaling-mlops
    spec:
      serviceAccountName: mlops-service-account
      containers:
        # 1. FastAPI Model Serving Microservice
        - name: inference-api
          image: docker.io/oktaavsm/predictive-autoscaler@sha256:830ad467010fdf4bd4139a6be11ccc2087d8642ae655f21fe706c9e603d32588
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              pip install --no-cache-dir minio boto3 && \
              mkdir -p /app/src/inference && \
              cp /config/inference/service.py /app/src/inference/service.py && \
              cp /config/inference/cluster_metrics.py /app/src/inference/cluster_metrics.py && \
              cp /config/inference/operational_store.py /app/src/inference/operational_store.py && \
              cp /config/inference/minio_sync.py /app/src/data/minio_sync.py && \
              exec uvicorn src.inference.service:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mlops-config
            - secretRef:
                name: mlops-object-storage
          env:
            - name: OPERATIONS_DB_PATH
              value: "/var/lib/mlops/operations.sqlite"
            - name: OPERATOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-api-auth
                  key: operator-token
            - name: SERVICE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-api-auth
                  key: service-token
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "https://storage.titipin.me"
          volumeMounts:
            - name: operations-state
              mountPath: /var/lib/mlops
            - name: inference-code
              mountPath: /config/inference
            - name: drift-reference
              mountPath: /app/data/processed/metrics_demo_processed.csv
              subPath: metrics_demo_processed.csv
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        # 2. Predictive Autoscaler Control Loop & Exporter
        - name: predictive-scaler
          image: docker.io/oktaavsm/predictive-autoscaler@sha256:830ad467010fdf4bd4139a6be11ccc2087d8642ae655f21fe706c9e603d32588
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              mkdir -p /app/src/scaling && \
              cp /config/inference/predictive_scaler.py /app/src/scaling/predictive_scaler.py && \
              exec python src/scaling/predictive_scaler.py
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mlops-config
            - secretRef:
                name: mlops-object-storage
          env:
            - name: INFERENCE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-api-auth
                  key: service-token
            - name: INFERENCE_URL
              value: "http://127.0.0.1:8000"
          volumeMounts:
            - name: inference-code
              mountPath: /config/inference
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: operations-state
          persistentVolumeClaim:
            claimName: mlops-operations-state
        - name: inference-code
          configMap:
            name: mlops-inference-code-hardening-20261013-0518
        - name: drift-reference
          configMap:
            name: mlops-training-data
