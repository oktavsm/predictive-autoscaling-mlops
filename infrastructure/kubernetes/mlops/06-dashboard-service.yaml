apiVersion: v1
kind: Service
metadata:
  name: mlops-dashboard-svc
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-dashboard-svc
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlops-dashboard
  ports:
    - name: http-dashboard
      port: 8501
      targetPort: 8501
      nodePort: 30851
      protocol: TCP
