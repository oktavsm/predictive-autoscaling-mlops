apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlops-continuous-training
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlops-continuous-training
    app.kubernetes.io/component: continuous-training-pipeline
    app.kubernetes.io/part-of: predictive-autoscaling-mlops
spec:
  schedule: "0 2 * * *"  # Runs daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mlops-continuous-training
            app.kubernetes.io/component: continuous-training-pipeline
            app.kubernetes.io/part-of: predictive-autoscaling-mlops
        spec:
          serviceAccountName: mlops-service-account
          restartPolicy: OnFailure
          containers:
            - name: continuous-training-runner
              image: docker.io/oktaavsm/predictive-autoscaler@sha256:830ad467010fdf4bd4139a6be11ccc2087d8642ae655f21fe706c9e603d32588
              imagePullPolicy: IfNotPresent
              command:
                - "/bin/sh"
                - "-c"
                - |
                  pip install --no-cache-dir minio boto3 && \
                  mkdir -p /app/src/pipeline /app/src/monitoring /app/src/models /app/src/data /app/data/raw /app/data/processed /app/reports /app/models && \
                  cp /config/ct/continuous_training.py /app/src/pipeline/ && \
                  cp /config/ct/drift_detector.py /app/src/monitoring/ && \
                  cp /config/ct/train.py /app/src/models/ && \
                  cp /config/ct/register_model.py /app/src/models/ && \
                  cp /config/ct/minio_sync.py /app/src/data/ && \
                  cp /config/ct/ingest_data.py /app/src/ && \
                  cp /config/ct/preprocess.py /app/src/ && \
                  cp /config/data/metrics_demo_processed.csv /app/data/processed/ && \
                  exec python src/pipeline/continuous_training.py --force --minutes 1440
              envFrom:
                - configMapRef:
                    name: mlops-config
                - secretRef:
                    name: mlops-object-storage
              env:
                - name: INFERENCE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mlops-api-auth
                      key: service-token
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: "when_required"
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: "when_required"
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: "https://storage.titipin.me"
                - name: MLFLOW_EXPERIMENT_NAME
                  value: "predictive-autoscaling-live"
                - name: MLFLOW_ARTIFACT_ROOT
                  value: "s3://mlops-dvc/mlflow/live"
                - name: OMP_NUM_THREADS
                  value: "2"
                - name: OPENBLAS_NUM_THREADS
                  value: "2"
              volumeMounts:
                - name: ct-code
                  mountPath: /config/ct
                - name: ct-data
                  mountPath: /config/data
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 1500m
                  memory: 2Gi
          volumes:
            - name: ct-code
              configMap:
                name: mlops-ct-code-hardening-20261013-0458
            - name: ct-data
              configMap:
                name: mlops-training-data
