# ==============================================================================
# Docker Compose Orchestration — Predictive Autoscaling MLOps (LK-09)
# ==============================================================================
# Orchestrates 4 unified microservices:
#   1. minio                : MinIO S3 Object Storage & Console (:9000, :9001)
#   2. mlflow-server        : MLflow Tracking & Model Registry Server (:5000)
#   3. mlops-inference-api  : FastAPI Anticipatory Pod Autoscaler Service (:8000)
#   4. mlops-dashboard      : Streamlit Interactive MLOps Control Dashboard (:8501)
# ==============================================================================

name: predictive-autoscaling-mlops

services:
  # ----------------------------------------------------------------------------
  # 1. MinIO Object Storage (S3 API & Web Console)
  # ----------------------------------------------------------------------------
  minio:
    build:
      context: .
      dockerfile: docker/Dockerfile.minio
    image: predictive-autoscaler-minio:latest
    container_name: mlops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mlops-network

  # ----------------------------------------------------------------------------
  # 2. MLflow Tracking & Model Registry Server
  # ----------------------------------------------------------------------------
  mlflow-server:
    image: predictive-autoscaler:ci-latest
    container_name: mlops-mlflow-server
    restart: unless-stopped
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////app/mlflow.db", "--default-artifact-root", "/app/mlruns", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mlops-network

  # ----------------------------------------------------------------------------
  # 3. FastAPI Inference Serving Microservice
  # ----------------------------------------------------------------------------
  mlops-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: predictive-autoscaler:ci-latest
    container_name: mlops-inference-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: predictive-autoscaler
      MODEL_ALIAS: champion
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
      TARGET_RPS_PER_POD: 10.0
      MIN_REPLICAS: 1
      MAX_REPLICAS: 4
    depends_on:
      mlflow-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mlops-network

  # ----------------------------------------------------------------------------
  # 4. Streamlit Interactive MLOps Control Dashboard
  # ----------------------------------------------------------------------------
  mlops-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: predictive-autoscaler-dashboard:latest
    container_name: mlops-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      INFERENCE_API_URL: http://mlops-inference-api:8000
      MLFLOW_URL: http://localhost:5000
      MINIO_URL: http://localhost:9001
    depends_on:
      mlops-inference-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mlops-network

volumes:
  minio_data:
    name: mlops_minio_data

networks:
  mlops-network:
    name: mlops-network
    driver: bridge
